name: Build AyuGram Desktop (with Python plugins)

on:
  workflow_dispatch: {}
  push:
    branches: [dev]

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 300 # полная сборка tdesktop-based клиента долгая, обычный
                          # лимит job'а (360 мин на публичных раннерах) может не хватить —
                          # при необходимости используйте self-hosted runner или сплитуйте job

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: tdesktop

      - name: Setup Python 3.10 (для сборочных скриптов и embedding)
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # --- Подготовка окружения Visual Studio ---
      # windows-latest = Windows Server 2025 с Visual Studio 2026 (ставится в
      # C:\Program Files\Microsoft Visual Studio\18\...), поэтому hardcoded-путь
      # к VS 2022 здесь не работает. Путём vcvars64.bat через vswhere — работает
      # на любом образе. -vcvars_ver=14.44 нужен обязательно: дефолтный toolset
      # VS 2026 (v145) не поддерживает Windows 7 (см. docs/building-win.md).
      - name: Find Visual Studio (vswhere)
        id: vsfind
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $vsPath) {
            throw "Visual Studio with C++ tools not found on the runner."
          }
          $vsPath = $vsPath.Trim()
          Write-Host "Visual Studio: $vsPath"
          "vsPath=$vsPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ascii

      # --- Официальный шаг подготовки библиотек (Telegram/build/prepare/win.bat) ---
      # Скачивает предсобранные Qt/webrtc/прочие зависимости — самый долгий шаг.
      # win.bat проверяет переменную окружения Platform (её выставляет
      # vcvars64.bat), поэтому сначала обязательно нужно войти в Native
      # Tools Command Prompt — иначе падает с "Make sure to run from
      # Native Tools Command Prompt."
      - name: Prepare libraries (official win.bat)
        shell: cmd
        run: |
          call "${{ steps.vsfind.outputs.vsPath }}\VC\Auxiliary\Build\vcvars64.bat" -vcvars_ver=14.44
          call tdesktop\Telegram\build\prepare\win.bat

      # --- Конфигурация проекта (официальная команда из docs/building-win.md) ---
      # ВАЖНО: используйте свои собственные api_id/api_hash с my.telegram.org,
      # а не публичные из документации, если планируете распространять сборку.
      # Если секреты TDESKTOP_API_ID/TDESKTOP_API_HASH не заданы, подставляются
      # публичные тестовые ключи из docs/building-win.md.
      - name: Configure (CMake via configure.bat)
        shell: cmd
        env:
          TDESKTOP_API_ID: ${{ secrets.TDESKTOP_API_ID }}
          TDESKTOP_API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          call "${{ steps.vsfind.outputs.vsPath }}\VC\Auxiliary\Build\vcvars64.bat" -vcvars_ver=14.44
          if "%TDESKTOP_API_ID%"=="" set "TDESKTOP_API_ID=2040"
          if "%TDESKTOP_API_HASH%"=="" set "TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627"
          cd tdesktop\Telegram
          configure.bat x64 -D TDESKTOP_API_ID=%TDESKTOP_API_ID% -D TDESKTOP_API_HASH=%TDESKTOP_API_HASH%

      # Сборка только target'а Telegram (с зависимостями): сборка всего solution
      # в Release на hosted-раннере рискует не уложиться в лимит времени job'а.
      - name: Build (Release)
        shell: cmd
        run: |
          call "${{ steps.vsfind.outputs.vsPath }}\VC\Auxiliary\Build\vcvars64.bat" -vcvars_ver=14.44
          msbuild tdesktop\out\Telegram.slnx /t:Telegram /p:Configuration=Release /p:Platform=x64 /m

      # --- Раскладываем наш Python-плагин рядом с итоговым exe ---
      - name: Bundle Python plugin runtime
        shell: pwsh
        run: |
          $outDir = "tdesktop\out\Release"
          New-Item -ItemType Directory -Force -Path "$outDir\plugins_runtime" | Out-Null
          New-Item -ItemType Directory -Force -Path "$outDir\plugins" | Out-Null
          Copy-Item "tdesktop\python\desktop_plugin_api.py" "$outDir\plugins_runtime\desktop_plugin_api.py"
          Copy-Item "tdesktop\python\plugins\quotify_plus_desktop.py" "$outDir\plugins\quotify_plus_desktop.py"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyuGramDesktop-with-plugins-windows-x64
          path: |
            tdesktop/out/Release/*.exe
            tdesktop/out/Release/plugins/**
            tdesktop/out/Release/plugins_runtime/**
          if-no-files-found: warn
